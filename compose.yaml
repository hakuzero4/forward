services:
  forward:
    # 直接使用 GHCR 发布的镜像，无需本地构建（无需 buildx）
    image: ghcr.io/hakuzero4/forward:latest
    container_name: forward
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 可选：服务端默认 Bot Token；也可在 /api/send 请求里传 bot_token，或用 /api/forward 拼进 URL
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # 可选：调用方鉴权 Token（强烈建议设置）
      RELAY_AUTH_TOKEN: ${RELAY_AUTH_TOKEN:-}
      # 可选：限制 /api/forward 的转发目标（逗号分隔，支持子域名）
      FORWARD_ALLOW_HOSTS: ${FORWARD_ALLOW_HOSTS:-}
      FORWARD_DENY_HOSTS: ${FORWARD_DENY_HOSTS:-}
      # 记录持久化到命名卷
      LOG_FILE: /data/forward.jsonl
      LOG_MAX: "1000"
    volumes:
      - forward-logs:/data

volumes:
  forward-logs: